apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate-nginx-proxy
  namespace: frigate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frigate-nginx-proxy
  template:
    metadata:
      labels:
        app: frigate-nginx-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: nginx-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: frigate-nginx-proxy
  namespace: frigate
spec:
  selector:
    app: frigate-nginx-proxy
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
