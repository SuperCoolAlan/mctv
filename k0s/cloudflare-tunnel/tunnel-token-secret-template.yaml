# Cloudflare Tunnel Token Secret Template
# DO NOT COMMIT THIS FILE WITH ACTUAL TOKEN
# 
# Instructions:
# 1. Copy this file to tunnel-token-secret.yaml
# 2. Get your tunnel token from Cloudflare Zero Trust dashboard
# 3. Replace YOUR-TUNNEL-TOKEN-HERE with the actual token
# 4. Apply the secret before deploying the tunnel
#
# To get the tunnel token:
# 1. Go to https://one.dash.cloudflare.com/
# 2. Navigate to Networks > Tunnels
# 3. Create a new tunnel or select existing
# 4. Configure the tunnel and copy the token from the install command

apiVersion: v1
kind: Secret
metadata:
  name: tunnel-token
  namespace: cloudflare
type: Opaque
stringData:
  token: YOUR-TUNNEL-TOKEN-HERE