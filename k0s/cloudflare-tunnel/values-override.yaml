# Cloudflare Tunnel configuration for mctv cluster
cloudflare:
  # REPLACE THESE with your actual values from Cloudflare Zero Trust dashboard
  # 1. Create a tunnel: https://one.dash.cloudflare.com/
  # 2. Get the tunnel ID and name
  tunnelName: "mctv-tunnel"  # CHANGE THIS
  tunnelId: "YOUR-TUNNEL-ID-HERE"  # CHANGE THIS
  
  # The secret will be created from tunnel-credentials.yaml
  secretName: "tunnel-credentials"
  
  # Ingress rules - routing configuration
  ingress:
    # Option 1: Direct routing to services (no ingress controller needed)
    - hostname: "frigate.mctv.example.com"  # CHANGE THIS to your domain
      service: "http://frigate.frigate.svc.cluster.local:5000"
      originRequest:
        noTLSVerify: true
    
    # Add more services as needed
    # - hostname: "app2.mctv.example.com"
    #   service: "http://app2-service.namespace.svc.cluster.local:port"
    
    # Option 2: If you install an ingress controller later
    # - hostname: "*.mctv.example.com"
    #   service: "https://ingress-nginx-controller.ingress-nginx.svc.cluster.local:443"
    #   originRequest:
    #     noTLSVerify: true
    
    # Catch-all rule (required) - returns 404 for unmatched requests
    - service: "http_status:404"

# Resource limits for Raspberry Pi
resources:
  limits:
    cpu: "200m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"

# Single replica for home setup
replicaCount: 1

# Use latest stable image
image:
  tag: "2025.1.0"  # Check for latest at https://hub.docker.com/r/cloudflare/cloudflared/tags