# Cloudflare Tunnel Credentials ConfigMap Template
# DO NOT COMMIT THIS FILE WITH ACTUAL CREDENTIALS
#
# Instructions:
# 1. Copy this file to tunnel-credentials-configmap.yaml
# 2. Replace the placeholder values with your actual Cloudflare tunnel credentials
# 3. Apply the configmap before deploying the tunnel
#
# To get the credentials:
# 1. Go to https://one.dash.cloudflare.com/
# 2. Navigate to Networks > Tunnels  
# 3. Create or select your tunnel
# 4. Get the credentials from the tunnel configuration

apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-credentials
  namespace: cloudflare
data:
  credentials.json: |
    {
      "AccountTag": "YOUR-ACCOUNT-TAG-HERE",
      "TunnelSecret": "YOUR-TUNNEL-SECRET-HERE", 
      "TunnelID": "YOUR-TUNNEL-ID-HERE"
    }