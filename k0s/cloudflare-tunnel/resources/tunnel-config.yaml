apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare
data:
  config.yaml: |
    tunnel: 03b29dbf-664a-451f-9f51-33980b1366f9
    credentials-file: /etc/cloudflared/creds/credentials.json
    
    # Ingress rules for routing
    # NOTE: Add all service routing rules here. Each service that needs external
    # access through Cloudflare tunnel should have an entry below.
    ingress:
      # Frigate NVR - Camera system (routes through nginx proxy for CORS/IPv6 fixes)
      - hostname: momscloset.asandov.com
        service: http://frigate-nginx-proxy.frigate.svc.cluster.local:8080
        originRequest:
          connectTimeout: 30s
          tcpKeepAlive: 30s
          keepAliveTimeout: 90s
          keepAliveConnections: 1
          # No TLS verification needed for HTTP
          disableChunkedEncoding: false
          http2Origin: false
      
      # Add more services here as needed:
      # - hostname: service.asandov.com
      #   service: http://service.namespace.svc.cluster.local:port
      
      # Catch-all rule (required) - returns 404 for unmatched requests  
      - service: http_status:404
    
    # Optional: Enable metrics
    metrics: 0.0.0.0:20241