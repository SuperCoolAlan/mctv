# Cloudflare Tunnel Credentials Secret
# DO NOT COMMIT THIS FILE WITH ACTUAL CREDENTIALS
# 
# Instructions:
# 1. Copy this file to tunnel-credentials.yaml
# 2. Get your tunnel credentials from Cloudflare
# 3. Replace YOUR-TUNNEL-CREDENTIALS-JSON with the actual JSON
# 4. Apply the secret before deploying the tunnel

apiVersion: v1
kind: Secret
metadata:
  name: tunnel-credentials
  namespace: cloudflare
type: Opaque
stringData:
  credentials.json: |
    YOUR-TUNNEL-CREDENTIALS-JSON
    
# To get the credentials JSON:
# 1. Go to https://one.dash.cloudflare.com/
# 2. Navigate to Networks > Tunnels
# 3. Create a new tunnel or use existing
# 4. Download the credentials file
# 5. Copy the JSON content here

# Example format (DO NOT use this, get your own):
# {
#   "AccountTag": "your-account-id",
#   "TunnelSecret": "your-tunnel-secret-base64",
#   "TunnelID": "your-tunnel-id"
# }