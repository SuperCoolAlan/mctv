apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: twingate

# Create the namespace
resources:
  - namespace.yaml

# Use Helm to generate the manifests
helmCharts:
  - name: connector
    repo: https://twingate.github.io/helm-charts
    version: 0.1.31
    releaseName: mctv3
    namespace: twingate
    valuesFile: values-override.yaml