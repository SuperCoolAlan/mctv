apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
spec:
  template:
    spec:
      containers:
      - name: frigate
        env:
        - name: FRIGATE_REOLINK_USERNAME
          valueFrom:
            secretKeyRef:
              name: camera-credentials
              key: reolink_username
        - name: FRIGATE_REOLINK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: camera-credentials
              key: reolink_password