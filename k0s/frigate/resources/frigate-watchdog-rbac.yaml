---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frigate-watchdog
  namespace: frigate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frigate-watchdog
  namespace: frigate
rules:
  # Read Frigate pod logs
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Update ConfigMap to switch detectors
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "patch", "update"]
  # Delete Frigate pod to trigger restart
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Check deployment status
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frigate-watchdog
  namespace: frigate
subjects:
  - kind: ServiceAccount
    name: frigate-watchdog
    namespace: frigate
roleRef:
  kind: Role
  name: frigate-watchdog
  apiGroup: rbac.authorization.k8s.io
