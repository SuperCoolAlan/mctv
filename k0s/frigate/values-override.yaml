# Custom values for Frigate deployment
# Overrides default values from the Helm chart

# Coral EdgeTPU configuration
coral:
  enabled: true
  hostPath: /dev/bus/usb

# Ingress disabled - using Cloudflare Tunnel instead
ingress:
  enabled: false
  # Cloudflare Tunnel will route directly to the service:
  # http://frigate.frigate.svc.cluster.local:5000

# Service configuration
service:
  type: ClusterIP  # ClusterIP is fine since Cloudflare Tunnel accesses it internally
  port: 5000

# Persistence for recordings and clips
persistence:
  config:
    enabled: true
    existingClaim: "frigate-config"  # Use our pre-created PVC
  media:
    enabled: true
    existingClaim: "frigate-media"  # Use our pre-created PVC

# Resource limits for Raspberry Pi
resources:
  limits:
    memory: 2Gi
    cpu: 2000m
  requests:
    memory: 1Gi
    cpu: 1000m

# Basic Frigate configuration
config: |
  # Authentication configuration
  auth:
    enabled: true
    reset_admin_password: false  # Password reset disabled
    failed_login_rate_limit: "1/second;5/minute;20/hour"
    trusted_proxies:
      - 10.244.0.0/16  # Kubernetes pod network
      - 10.0.0.0/8     # Cluster service network
      - 172.16.0.0/12  # Docker networks
      - 192.168.0.0/16 # Local networks
      # Cloudflare IPv4 ranges
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
  
  mqtt:
    enabled: false  # Disable MQTT if not using Home Assistant
  
  # Detectors configuration
  detectors:
    # Coral TPU detector (REQUIRED - do not add CPU detector with EdgeTPU model!)
    coral:
      type: edgetpu
      device: usb

  # Model configuration for EdgeTPU
  model:
    path: /edgetpu_model.tflite
    width: 320
    height: 320
  
  # Camera configuration
  cameras:
    reolink_camera:
      enabled: false # Enable camera
      ffmpeg:
        inputs:
          # Reolink main stream (high quality for recording)
          - path: rtsp://{FRIGATE_REOLINK_USERNAME}:{FRIGATE_REOLINK_PASSWORD}@10.0.1.18:554/h264Preview_01_main
            roles:
              - record
              - audio
          # Reolink sub stream (lower quality for detection)
          - path: rtsp://{FRIGATE_REOLINK_USERNAME}:{FRIGATE_REOLINK_PASSWORD}@10.0.1.18:554/h264Preview_01_sub
            roles:
              - detect
        # Reolink-specific settings
        hwaccel_args: []  # Disabled for now
        output_args:
          record: preset-record-generic-audio-aac
      detect:
        enabled: true
        width: 1920
        height: 1080
        fps: 5
      record:
        enabled: true
        retain:
          days: 7
          mode: all
      snapshots:
        enabled: true
        timestamp: true
        retain:
          default: 10
      # Audio configuration
      audio:
        enabled: true

# Environment variables
env:
  TZ: "America/Chicago"  # Set your timezone

# Shared memory for frame processing
shmSize: 256Mi  # Reduced for Raspberry Pi

# Temp filesystem for cache
tmpfs:
  enabled: false  # Disabled to avoid cross-device link errors
  sizeLimit: 256Mi  # Reduced for Raspberry Pi

# Additional environment variables to fix cache issues
extraEnvVars:
  - name: FRIGATE_TMPFS_CACHE_SIZE
    value: "256m"
