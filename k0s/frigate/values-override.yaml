# Custom values for Frigate deployment
# Overrides default values from the Helm chart

# Ingress disabled - using Cloudflare Tunnel instead
ingress:
  enabled: false
  # Cloudflare Tunnel will route directly to the service:
  # http://frigate.frigate.svc.cluster.local:5000

# Service configuration
service:
  type: ClusterIP  # ClusterIP is fine since Cloudflare Tunnel accesses it internally
  port: 5000

# Persistence for recordings and clips
persistence:
  config:
    enabled: true
    storageClass: "local-path"  # k0s default storage class
    size: 10Gi
  media:
    enabled: true
    storageClass: "local-path"
    size: 50Gi  # Adjust based on your storage needs

# Resource limits for Raspberry Pi
resources:
  limits:
    memory: 2Gi
    cpu: 2000m
  requests:
    memory: 1Gi
    cpu: 1000m

# Basic Frigate configuration
config: |
  # Authentication configuration
  auth:
    enabled: true
    reset_admin_password: false  # Password reset disabled
  
  mqtt:
    enabled: false  # Disable MQTT if not using Home Assistant
  
  # Detectors configuration
  detectors:
    # Coral TPU detector (REQUIRED - do not add CPU detector with EdgeTPU model!)
    coral:
      type: edgetpu
      device: usb

  # Model configuration for EdgeTPU
  model:
    path: /edgetpu_model.tflite
    width: 320
    height: 320
  
  # Camera configuration
  cameras:
    reolink_camera:
      enabled: false  # Disabled until camera is properly configured
      ffmpeg:
        inputs:
          # Reolink main stream (high quality for recording)
          - path: rtsp://admin:CHANGE_ME@10.0.1.18:554/h264Preview_01_main
            roles:
              - record
          # Reolink sub stream (lower quality for detection)  
          - path: rtsp://admin:CHANGE_ME@10.0.1.18:554/h264Preview_01_sub
            roles:
              - detect
        # Reolink-specific settings
        hwaccel_args: preset-rpi4-64bit
        output_args:
          record: preset-record-generic-audio-aac
      detect:
        enabled: false
        width: 1920
        height: 1080
        fps: 5
      record:
        enabled: false
        retain:
          days: 7
          mode: all
      snapshots:
        enabled: false
        timestamp: true
        retain:
          default: 10

# Environment variables
env:
  TZ: "America/Chicago"  # Set your timezone

# Shared memory for frame processing
shmSize: 256Mi  # Reduced for Raspberry Pi

# Temp filesystem for cache
tmpfs:
  enabled: true
  sizeLimit: 256Mi  # Reduced for Raspberry Pi

# Additional environment variables to fix cache issues
extraEnvVars:
  - name: FRIGATE_TMPFS_CACHE_SIZE
    value: "256m"