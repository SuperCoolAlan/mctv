# Custom values for Frigate deployment on k0s cluster
# Overrides default values from the blakeshome-charts Helm chart v7.6.0
# Last updated: September 2025

# Coral EdgeTPU configuration
coral:
  enabled: true
  hostPath: /dev/bus/usb

# Ingress disabled - using Cloudflare Tunnel with NGINX proxy
ingress:
  enabled: false
  # Cloudflare Tunnel routes to nginx proxy to handle CORS/IPv6 issues:
  # http://frigate-nginx-proxy.frigate.svc.cluster.local:8080

# Service configuration
service:
  type: ClusterIP  # ClusterIP is fine since Cloudflare Tunnel accesses it internally
  port: 5000

# Persistence using OpenEBS storage
persistence:
  config:
    enabled: true
    existingClaim: "frigate-config"  # 5Gi PVC for Frigate configuration
  media:
    enabled: true
    existingClaim: "frigate-media"   # 100Gi PVC for recordings and snapshots

# Resource limits for Raspberry Pi
resources:
  limits:
    memory: 2Gi     # Full allocation for Frigate runtime
    cpu: 2000m      # Allow full CPU usage
  requests:
    memory: 1Gi     # Higher request for stable startup
    cpu: 1000m      # Higher CPU request for startup tasks

# Basic Frigate configuration
config: |
  # Authentication configuration
  auth:
    enabled: true
    reset_admin_password: false # Password reset disabled
    failed_login_rate_limit: "1/second;5/minute;20/hour"
    trusted_proxies:
      # Internal Kubernetes networks
      - 10.244.0.0/16  # k0s pod network (flannel)
      - 10.0.0.0/8     # Service network
      - 172.16.0.0/12  # Docker bridge networks
      - 192.168.0.0/16 # Local LAN
      # Cloudflare proxy IPs (IPv4 only - IPv6 filtered by nginx proxy)
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
  
  mqtt:
    enabled: false  # Disable MQTT if not using Home Assistant
  
  # Object detection configuration
  detectors:
    # Coral EdgeTPU USB accelerator for efficient object detection
    coral:
      type: edgetpu
      device: usb
    # CPU detector for testing (watchdog will auto-enable if Coral fails)
    # cpu1:
    #   type: cpu
    #   num_threads: 3

  # Model optimized for EdgeTPU
  model:
    path: /edgetpu_model.tflite  # Pre-included EdgeTPU model
    width: 320
    height: 320

  # Reolink camera at 192.168.1.101
  cameras:
    mctv:
      enabled: true
      ffmpeg:
        inputs:
          - path: rtsp://{FRIGATE_REOLINK_USERNAME}:{FRIGATE_REOLINK_PASSWORD}@192.168.1.101:554/h264Preview_01_main
            roles:
              - record  # Continuous recording
              - audio   # Audio recording enabled
          # Sub stream: Lower resolution for efficient motion detection
          - path: rtsp://{FRIGATE_REOLINK_USERNAME}:{FRIGATE_REOLINK_PASSWORD}@192.168.1.101:554/h264Preview_01_sub
            roles:
              - detect  # Object detection via Coral EdgeTPU
        # Hardware acceleration disabled on Raspberry Pi
        hwaccel_args: []
        output_args:
          record: preset-record-generic-audio-aac  # AAC audio codec
      detect:
        enabled: true
        width: 1920
        height: 1080
        fps: 5
      record:
        enabled: true
        retain:
          days: 22
          mode: all
        events:
          retain:
            default: 30
            mode: motion
      snapshots:
        enabled: true
        timestamp: true
        retain:
          default: 10
      # Audio configuration
      audio:
        enabled: true

# Environment
env:
  TZ: "America/Chicago"  # Central Time

# Shared memory for inter-process communication (frame passing)
shmSize: 256Mi  # Optimized for Raspberry Pi 5

# Temporary filesystem for cache
tmpfs:
  enabled: false  # Disabled - using disk cache to avoid tmpfs issues
  sizeLimit: 256Mi

# Additional environment variables
extraEnvVars:
  - name: FRIGATE_TMPFS_CACHE_SIZE
    value: "256m"  # Cache size when tmpfs is enabled
