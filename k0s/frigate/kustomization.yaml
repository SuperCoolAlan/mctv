apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: frigate

# Create the namespace
resources:
  - namespace.yaml

# Use Helm to generate the manifests
helmCharts:
  - name: frigate
    repo: https://blakeblackshear.github.io/blakeshome-charts/
    version: 7.6.0  # Check for latest version at https://github.com/blakeblackshear/blakeshome-charts
    releaseName: frigate
    namespace: frigate
    valuesFile: values-override.yaml
    # Alternative: use inline values
    # valuesInline:
    #   key: value

# Optional: Add patches for additional customization
patches: []
# Example patch to add labels
# - target:
#     kind: Deployment
#     name: frigate
#   patch: |-
#     - op: add
#       path: /metadata/labels/environment
#       value: production

# Optional: Add config maps or secrets
configMapGenerator: []
# - name: frigate-config
#   files:
#     - config.yaml

secretGenerator: []
# - name: frigate-credentials
#   literals:
#     - username=admin
#     - password=secret