apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: frigate

# Create the namespace
resources:
  - resources/namespace.yaml
  - resources/pvcs.yaml
  - resources/nginx-proxy-configmap.yaml
  - resources/nginx-proxy-deployment.yaml

# Use Helm to generate the manifests
helmCharts:
  - name: frigate
    repo: https://blakeblackshear.github.io/blakeshome-charts/
    version: 7.6.0  # Check for latest version at https://github.com/blakeblackshear/blakeshome-charts
    releaseName: frigate
    namespace: frigate
    valuesFile: values-override.yaml
    # Alternative: use inline values
    # valuesInline:
    #   key: value

# Patches for Coral USB support and environment secrets
patches:
  - path: patches/coral-usb-patch.yaml
    target:
      kind: Deployment
      name: frigate
  - path: patches/env-secrets-patch.yaml
    target:
      kind: Deployment
      name: frigate

# ConfigMap generator removed - using direct resource instead
configMapGenerator: []

# Secrets generator for encrypted credentials
generators:
  - secrets-generator.yaml